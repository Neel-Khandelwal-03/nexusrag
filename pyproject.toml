[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nexusrag"
dynamic = ["version"]
description = "Advanced RAG chatbot: hybrid search, reranking, self-correcting agent, citations and evaluation on Chainlit + ChromaDB + Gemini."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Neel Khandelwal" }]
keywords = ["rag", "llm", "gemini", "chromadb", "chainlit", "hybrid-search"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "google-genai>=2.24,<3",
  "httpx>=0.27",
  "numpy>=2.0",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "structlog>=25.1",
  "tenacity>=9.0,<10",
  "tiktoken>=0.9",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.0",
  "pytest>=9.0",
  "pytest-asyncio>=1.0",
  "ruff>=0.16",
]

[project.urls]
Repository = "https://github.com/Neel-Khandelwal-03/nexusrag"
Issues = "https://github.com/Neel-Khandelwal-03/nexusrag/issues"

[tool.hatch.version]
path = "src/nexusrag/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusrag"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "RUF",      # ruff-specific
  "ASYNC",    # async pitfalls
  "PT",       # pytest style
]
# Prompts and docs legitimately use typographic characters (en dash, arrows, curly quotes).
ignore = ["RUF001", "RUF002", "RUF003"]

# --------------------------------------------------------------------------- mypy
# Deliberately lenient: typed public surfaces, no strict mode.
[tool.mypy]
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
