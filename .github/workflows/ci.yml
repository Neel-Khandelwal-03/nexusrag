name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [staging, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name doubles as the required status check in branch protection,
  # so keep it stable.
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests mock Gemini; make sure no real key could ever be picked up.
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest

  # Builds exactly what deploys (Gemini reranker, no torch) and checks the container
  # starts and answers. Gemini is never called: the key is a dummy and indexing is off.
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nexusrag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name nexusrag -p 8000:8000 \
            -e GEMINI_API_KEY=ci-dummy-key \
            -e BOOTSTRAP_INDEX=false \
            -e ENVIRONMENT=development \
            nexusrag:ci

      - name: Wait until healthy
        run: |
          for _ in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' nexusrag)
            case "$status" in
              healthy) echo "container healthy"; exit 0 ;;
              unhealthy) break ;;
            esac
            sleep 5
          done
          echo "container never became healthy"
          exit 1

      - name: Check it runs as a non-root user
        run: |
          test "$(docker exec nexusrag id -u)" = "1000"

      - name: Container logs
        if: always()
        run: docker logs nexusrag
